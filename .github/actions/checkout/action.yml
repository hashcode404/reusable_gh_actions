name: Checkout
description: Reusable repository checkout action

inputs:
  repository:
    description: Repository to checkout
    required: false
    default: ${{ github.repository }}
  ref:
    description: Branch, tag, or SHA to checkout
    required: false
    default: ""
  token:
    description: Token used to fetch the repository
    required: false
    default: ${{ github.token }}
  path:
    description: Relative path under $GITHUB_WORKSPACE to place the repository
    required: false
    default: ""
  fetch-depth:
    description: Number of commits to fetch
    required: false
    default: "1"
  persist-credentials:
    description: Configure the token with the local git config
    required: false
    default: "true"
  clean:
    description: Remove untracked files after checkout
    required: false
    default: "true"
  lfs:
    description: Download Git LFS files
    required: false
    default: "false"
  submodules:
    description: Checkout submodules
    required: false
    default: "false"
  ssh-key:
    description: SSH key to use for checkout
    required: false
    default: ""
  ssh-known-hosts:
    description: SSH known hosts to use
    required: false
    default: ""
  set-safe-directory:
    description: Mark the repository path as a safe Git directory
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        path: ${{ inputs.path }}
        fetch-depth: ${{ inputs.fetch-depth }}
        persist-credentials: ${{ inputs.persist-credentials }}
        clean: ${{ inputs.clean }}
        lfs: ${{ inputs.lfs }}
        submodules: ${{ inputs.submodules }}
        ssh-key: ${{ inputs.ssh-key }}
        ssh-known-hosts: ${{ inputs.ssh-known-hosts }}

    - name: Mark repository path as safe
      if: ${{ inputs.set-safe-directory == 'true' }}
      shell: bash
      run: |
        if [ -n "${{ inputs.path }}" ]; then
          git config --global --add safe.directory "${GITHUB_WORKSPACE}/${{ inputs.path }}"
        else
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
        fi