
    name: Verify GitHub Secrets
    
    on:
      workflow_dispatch:
    
    jobs:
      verify-secrets:
        runs-on: ubuntu-latest
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
    
        steps:
          - name: Check secrets
            shell: bash
            run: |
              check_secret() {
                local name="$1"
                local value="$2"
    
                if [[ -n "$value" ]]; then
                  echo "$name is configured"
                else
                  echo "$name is not configured"
                fi
              }
    
              check_secret "IG_USERNAME" "$IG_USERNAME"