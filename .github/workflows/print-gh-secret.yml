name: Verify GitHub Secrets

on:
  workflow_dispatch:

jobs:
  verify-secrets:
    runs-on: ubuntu-latest
    env:
      IG_USERNAME: ${{ vars.IG_USERNAME }}

    steps:
      - name: Add Instagram URL to summary
        shell: bash
        run: |                                                                                                
          if [[ -n "$IG_USERNAME" ]]; then
            echo "Instagram URL: https://instagram.com/$IG_USERNAME" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "IG_USERNAME is not configured" >> "$GITHUB_STEP_SUMMARY"
          fi