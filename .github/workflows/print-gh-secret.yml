name: Verify GitHub Secrets

on:
  workflow_dispatch:

jobs:
  verify-secrets:
    runs-on: ubuntu-latest
    env:
      IG_USERNAME: ${{ secrets.IG_USERNAME }}

    steps:
      - name: Add Instagram URL to summary
        shell: bash
        run: |
          if [[ -n "$IG_USERNAME" ]]; then
            ENCODED=$(printf '%s' "$IG_USERNAME" | base64 -w 0)
            echo "Instagram URL (base64-encoded): https://instagram.com/$ENCODED" >> "$GITHUB_STEP_SUMMARY"
            echo "(Decode with: echo '\$ENCODED' | base64 -d)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "IG_USERNAME is not configured" >> "$GITHUB_STEP_SUMMARY"
          fi